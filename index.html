<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gole Limpo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#0284c7">
  <link rel="icon" href="https://fav.farm/💧">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-12">

  <!-- Diagnóstico no topo para sabermos se o telemóvel está a aceitar guardar dados -->
  <div id="storageAlert" class="bg-amber-500/20 text-amber-200 text-[11px] px-3 py-1 text-center border-b border-amber-500/30">
    A testar armazenamento local...
  </div>

  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <span class="text-2xl">💧</span>
      <div>
        <h1 class="text-lg font-bold leading-none text-sky-400">Gole Limpo</h1>
        <p class="text-xs text-slate-400">Vape to Water</p>
      </div>
    </div>
    <button onclick="resetDataPrompt()" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded border border-slate-700 active:scale-95 transition">
      Zerar
    </button>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-5">

    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 text-center shadow-lg">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tempo sem fumar</span>
      <div id="cleanTimer" class="text-3xl font-extrabold text-sky-400 mt-1 tracking-tight">0d 0h 00m 00s</div>
      <p id="startTimeInfo" class="text-[10px] text-slate-500 mt-1">Início: a carregar...</p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 flex flex-col items-center justify-center">
        <span class="text-xs text-slate-400">Água Consumida</span>
        <span id="waterCount" class="text-2xl font-bold text-sky-300 mt-0.5">0 ml</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 flex flex-col items-center justify-center">
        <span class="text-xs text-slate-400">Gatilhos Vencidos</span>
        <span id="cravingsCount" class="text-2xl font-bold text-emerald-400 mt-0.5">0</span>
      </div>
    </div>

    <div class="flex flex-col items-center gap-3 my-auto py-4">
      <button onclick="registerWaterDrink()" class="w-48 h-48 rounded-full bg-gradient-to-tr from-sky-600 to-cyan-400 text-white font-extrabold shadow-xl shadow-sky-500/20 active:scale-95 transition-all flex flex-col items-center justify-center border-4 border-sky-300/30">
        <span class="text-4xl mb-1">💧</span>
        <span class="text-lg leading-tight text-center px-4">Troquei por Água!</span>
        <span class="text-xs opacity-80 mt-1">+200 ml</span>
      </button>

      <button onclick="openSlipModal()" class="text-xs text-rose-400/80 hover:text-rose-300 py-2 px-4 rounded-full border border-rose-900/40 bg-rose-950/20 active:scale-95 transition">
        ⚠️ Acabei dando uma puxada
      </button>
    </div>

    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Histórico de Hoje</span>
        <span id="slipCounter" class="text-xs font-semibold text-rose-400">0 puxadas</span>
      </div>
      <div id="logList" class="flex flex-col gap-2 max-h-48 overflow-y-auto text-xs pr-1">
      </div>
    </div>

  </main>

  <div id="slipModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 max-w-sm w-full rounded-2xl p-5 shadow-2xl">
      <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
        <span>⚠️</span> Registar Puxada
      </h3>
      <p class="text-xs text-slate-400 mt-1">Identificar o gatilho ajuda a antecipar a próxima vez.</p>

      <div class="mt-4">
        <label class="text-xs font-semibold text-slate-300">Qual foi o gatilho?</label>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <button type="button" onclick="selectTrigger('Ansiedade')" class="trigger-btn bg-slate-700 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600">Ansiedade</button>
          <button type="button" onclick="selectTrigger('Tédio / Hábito')" class="trigger-btn bg-slate-700 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600">Tédio</button>
          <button type="button" onclick="selectTrigger('Social')" class="trigger-btn bg-slate-700 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600">Social</button>
          <button type="button" onclick="selectTrigger('Pós-café')" class="trigger-btn bg-slate-700 text-slate-200 text-xs py-2 px-3 rounded-lg border border-slate-600">Pós-café</button>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-2">
        <input type="checkbox" id="resetTimerCheck" class="w-4 h-4 rounded text-sky-500 bg-slate-700 border-slate-600">
        <label for="resetTimerCheck" class="text-xs text-slate-300">Reiniciar o cronómetro</label>
      </div>

      <div class="mt-5 flex gap-2">
        <button onclick="closeSlipModal()" class="flex-1 bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold">Cancelar</button>
        <button onclick="confirmSlip()" class="flex-1 bg-rose-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-rose-900/40">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gole_limpo_dados_v2';
    let selectedTrigger = 'Tédio / Hábito';

    let state = {
      startTime: Date.now(),
      waterTotal: 0,
      cravingsSaved: 0,
      slips: 0,
      logs: []
    };

    function checkStorageSupport() {
      const el = document.getElementById('storageAlert');
      try {
        localStorage.setItem('__test_storage__', '1');
        localStorage.removeItem('__test_storage__');
        el.className = 'bg-emerald-500/20 text-emerald-300 text-[11px] px-3 py-1 text-center border-b border-emerald-500/30';
        el.textContent = '✓ Memória local ativa e a gravar neste dispositivo';
      } catch (e) {
        el.className = 'bg-rose-500/20 text-rose-300 text-[11px] px-3 py-1 text-center border-b border-rose-500/30';
        el.textContent = 'Aviso: O navegador está em modo restrito ou privado. Os dados serão perdidos ao fechar.';
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Erro ao guardar:', e);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        } else {
          saveState();
        }
      } catch (e) {
        console.error('Erro ao ler:', e);
      }
      renderUI();
    }

    function renderUI() {
      document.getElementById('waterCount').textContent = `${state.waterTotal} ml`;
      document.getElementById('cravingsCount').textContent = state.cravingsSaved;
      document.getElementById('slipCounter').textContent = `${state.slips} ${state.slips === 1 ? 'puxada' : 'puxadas'}`;

      const d = new Date(state.startTime);
      document.getElementById('startTimeInfo').textContent = `Início: ${d.toLocaleDateString()} às ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

      const logContainer = document.getElementById('logList');
      logContainer.innerHTML = '';

      if (state.logs.length === 0) {
        logContainer.innerHTML = '<span class="text-slate-500 italic">Nenhum registo ainda.</span>';
        return;
      }

      state.logs.slice().reverse().forEach(log => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 rounded-lg ' + 
          (log.type === 'water' ? 'bg-slate-700/40 border border-sky-900/20' : 'bg-rose-950/30 border border-rose-900/30');
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span>${log.type === 'water' ? '💧' : '⚠️'}</span>
            <span class="${log.type === 'water' ? 'text-slate-200' : 'text-rose-300 font-semibold'}">${log.desc}</span>
          </div>
          <span class="text-slate-400 text-[10px]">${log.time}</span>
        `;
        logContainer.appendChild(item);
      });
    }

    function registerWaterDrink() {
      state.waterTotal += 200;
      state.cravingsSaved += 1;
      const now = new Date();
      state.logs.push({
        type: 'water',
        desc: 'Trocou fissura por 200ml de água',
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      saveState();
      renderUI();
    }

    function openSlipModal() {
      document.getElementById('slipModal').classList.remove('hidden');
    }

    function closeSlipModal() {
      document.getElementById('slipModal').classList.add('hidden');
    }

    function selectTrigger(name) {
      selectedTrigger = name;
    }

    function confirmSlip() {
      state.slips += 1;
      if (document.getElementById('resetTimerCheck').checked) {
        state.startTime = Date.now();
      }
      const now = new Date();
      state.logs.push({
        type: 'slip',
        desc: `Puxada (${selectedTrigger})`,
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      saveState();
      renderUI();
      closeSlipModal();
    }

    function resetDataPrompt() {
      if (confirm('Deseja repor todos os registos?')) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          startTime: Date.now(),
          waterTotal: 0,
          cravingsSaved: 0,
          slips: 0,
          logs: []
        };
        saveState();
        renderUI();
      }
    }

    function updateTimer() {
      const diff = Math.floor((Date.now() - state.startTime) / 1000);
      const days = Math.floor(diff / 86400);
      const hours = Math.floor((diff % 86400) / 3600);
      const mins = Math.floor((diff % 3600) / 60);
      const secs = diff % 60;
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('cleanTimer').textContent = `${days}d ${hours}h ${pad(mins)}m ${pad(secs)}s`;
    }

    checkStorageSupport();
    loadState();
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
